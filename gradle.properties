# Memoria asignada a Gradle (4G suele ir más fluido al descompilar con varias dependencias)
org.gradle.jvmargs=-Xmx4G
org.gradle.daemon=true


## Propiedades del Entorno

# La versión de Minecraft debe coincidir con la versión de Forge para obtener un artefacto válido
minecraft_version=1.20.1
minecraft_version_range=[1.20.1,1.21)
forge_version=47.4.10
forge_version_range=[47,)
loader_version_range=[47,)

# El canal de mapeo a usar para los mapeos.
# Se pueden registrar canales de mapeo adicionales a través de la extensión "channelProviders" en un plugin de Gradle.
# Debes estar al tanto de la licencia de Mojang al usar los mapeos 'official' o 'parchment'.
# Mapeos con Parchment para tener nombres de variables legibles en el código de Minecraft
mapping_channel=parchment
# La versión de mapeo a consultar desde el canal de mapeo.
# Esta debe coincidir con el formato requerido por el canal de mapeo.
mapping_version=2023.09.03-1.20.1


## Propiedades del Mod

# El identificador único para el mod. Debe estar en minúsculas en configuración regional en inglés.
mod_id=chilean_expansion
# El nombre legible para mostrar del mod.
mod_name=Chilean Expansion
# La licencia del mod. Revisa tus opciones en https://choosealicense.com/. Todos los Derechos Reservados (All Rights Reserved) es la opción por defecto.
mod_license=All Rights Reserved
# La versión del mod. Consulta https://semver.org/
mod_version=0.1.0
# El group ID para el mod. Solo es importante al publicar como un artefacto en un repositorio Maven.
mod_group_id=com.jaziel.chilean_expansion
# Los autores del mod. Esta es una cadena de texto simple que se usa con fines de visualización en la lista de mods.
mod_authors=Jaziel
# La descripción del mod. Esta es una cadena de texto multilínea simple que se usa con fines de visualización en la lista de mods.
# Se pueden usar caracteres de salto de línea (\n) y se reemplazarán adecuadamente.
mod_description=Adaptación de la biodiversidad y cultura chilena para Minecraft.

## Versiones de Dependencias Requeridas (1.20.1)
geckolib_version=4.8.4
terrablender_version=3.0.1.11
curios_version=5.14.1+1.20.1

