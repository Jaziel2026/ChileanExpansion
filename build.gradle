plugins {
    id 'idea'
    id 'maven-publish'
    id 'net.minecraftforge.gradle' version '[6.0,6.2)'
    id 'org.parchmentmc.librarian.forgegradle' version '1.+'
    id 'org.spongepowered.mixin' version '0.7.+'
}

version = mod_version
group = mod_group_id

base {
    archivesName = mod_id
}

// Para la 1.20.1 se usa Java 17
java.toolchain.languageVersion = JavaLanguageVersion.of(17)

println "Java: ${System.getProperty 'java.version'}, JVM: ${System.getProperty 'java.vm.version'} (${System.getProperty 'java.vendor'}), Arch: ${System.getProperty 'os.arch'}"
minecraft {
    // El mapeo esta sujeto a la licencia de Mojang, aunque puede cambiarse si se quiere, pero, para mi no es nada necesario
    mappings channel: mapping_channel, version: mapping_version

    copyIdeResources = true

    // Esta propiedad sirve para proyectos multi-módulo usando APIs como Architectury para moddear en Forge, NeoForge y Fabric simultaneamente
    // El nombre de carpeta se puede definir en una configuración usando la propiedad "folderName".
    // Por defecto, el nombre de carpeta de una configuración es el nombre del proyecto Gradle que la contiene.
    // generateRunFolders = true

    // Esta propiedad habilita los access transformers para su uso en desarrollo, pone en public código fuente que Mojang tiene en privado
    // accessTransformer = file('src/main/resources/META-INF/accesstransformer.cfg')

    // Configuraciones de ejecución por defecto.
    // Se pueden ajustar, eliminar o duplicar según sea necesario.
    runs {
        configureEach {
            workingDirectory project.file('run')

            // "SCAN": Para el escaneo de mods.
            // "REGISTRIES": Para el disparo de eventos de registro.
            // "REGISTRYDUMP": Para obtener el contenido de todos los registros.
            property 'forge.logging.markers', 'REGISTRIES'
            property 'forge.logging.console.level', 'debug'

            // Propiedades necesarias para Mixin (GeckoLib/TerraBlender)
            property 'mixin.env.remapRefMap', 'true'
            property 'mixin.env.refMapRemappingFile', "${projectDir}/build/createSrgToMcp/output.srg"
            arg "-mixin.config=${mod_id}.mixins.json"

            mods {
                "${mod_id}" {
                    source sourceSets.main
                }
            }
        }

        client {
            property 'forge.enabledGameTestNamespaces', mod_id
        }

        server {
            property 'forge.enabledGameTestNamespaces', mod_id
            args '--nogui'
        }

        gameTestServer {
            property 'forge.enabledGameTestNamespaces', mod_id
        }

        data {
            workingDirectory project.file('run-data')
            args '--mod', mod_id, '--all', '--output', file('src/generated/resources/'), '--existing', file('src/main/resources/')
        }
    }
}

mixin {
    add sourceSets.main, "${mod_id}.refmap.json"
    config "${mod_id}.mixins.json"
}

sourceSets.main.resources { srcDir 'src/generated/resources' }

repositories {
    // 1. GeckoLib (Animaciones de mobs, armaduras, etc.)
    maven {
        name = 'GeckoLib'
        url = 'https://dl.cloudsmith.io/public/geckolib3/geckolib/maven/'
        content {
            includeGroupByRegex("software\\.bernie.*")
            includeGroup("com.eliotlash.mclib")
        }
    }

    // 2. TerraBlender (Generación de biomas: Araucanía, Selva Chilena, etc.)
    maven {
        name = 'Glitchfiend'
        url = 'https://maven.glitchfiend.com/'
    }

    // 3. Curios API (Ranuras extra para el Amuleto de Pudú y Canasto de Quila)
    maven {
        name = 'TheIllusiveC4'
        url = 'https://maven.theillusivec4.top/'
    }

    // 4. CurseMaven (Muy útil para agregar mods de compatibilidad como Ashen o Copper Age Backport directamente desde CurseForge)
    maven {
        name = 'CurseMaven'
        url = 'https://cursemaven.com'
        content {
            includeGroup 'curse.maven'
        }
    }
}

dependencies {
    minecraft "net.minecraftforge:forge:${minecraft_version}-${forge_version}"

    //fg.deobf es el traductor o diccionario estandar

    // Procesador de Mixin
    annotationProcessor 'org.spongepowered:mixin:0.8.5:processor'

    // --- DEPENDENCIAS REQUERIDAS DEL MOD ---

    // GeckoLib
    implementation fg.deobf("software.bernie.geckolib:geckolib-forge-${minecraft_version}:${geckolib_version}")
    implementation("com.eliotlash.mclib:mclib:20")

    // TerraBlender
    implementation fg.deobf("com.github.glitchfiend:TerraBlender-forge:${minecraft_version}-${terrablender_version}")

    // Curios API (Separado en API para compilar y JAR completo para ejecutar en pruebas)
    compileOnly fg.deobf("top.theillusivec4.curios:curios-forge:${curios_version}:api")
    runtimeOnly fg.deobf("top.theillusivec4.curios:curios-forge:${curios_version}")
}

tasks.named('processResources', ProcessResources).configure {
    var replaceProperties = [
            minecraft_version: minecraft_version, minecraft_version_range: minecraft_version_range,
            forge_version: forge_version, forge_version_range: forge_version_range,
            loader_version_range: loader_version_range,
            mod_id: mod_id, mod_name: mod_name, mod_license: mod_license, mod_version: mod_version,
            mod_authors: mod_authors, mod_description: mod_description,
    ]
    inputs.properties replaceProperties

    filesMatching(['META-INF/mods.toml', 'pack.mcmeta']) {
        expand replaceProperties + [project: project]
    }
}

tasks.named('jar', Jar).configure {
    manifest {
        attributes([
                'Specification-Title'     : mod_id,
                'Specification-Vendor'    : mod_authors,
                'Specification-Version'   : '1', // We are version 1 of ourselves
                'Implementation-Title'    : project.name,
                'Implementation-Version'  : project.jar.archiveVersion,
                'Implementation-Vendor'   : mod_authors,
                'Implementation-Timestamp': new Date().format("yyyy-MM-dd'T'HH:mm:ssZ"),
                'MixinConfigs'            : "${mod_id}.mixins.json"
        ])
    }

    // Este es el método preferido para reofuscar tu archivo JAR
    finalizedBy 'reobfJar'
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8' // Usa la codificación de caracteres UTF-8 para la compilación de Java
}
